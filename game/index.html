<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal &amp; Static</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070d;
      color: #ffb545;
      font-family: Impact, "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020308;
    }

    #game-canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #05070d;
      touch-action: none;
      image-rendering: auto;
      box-shadow: 0 0 48px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="game-canvas" width="1280" height="720" aria-label="Signal and Static Radio Game"></canvas>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
